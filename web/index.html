<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>用户管理</title>
  <link rel="stylesheet" href="https://unpkg.com/element-plus/dist/index.css" />
  <style>
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f5f5; }
    #app { width: 100%; min-height: 100vh; padding: 40px 20px; box-sizing: border-box; }
    .user-header { display: flex; justify-content: space-between; align-items: center; margin: 0 auto 30px; max-width: 1200px; }
    .title { font-size: 32px; color: #333; margin: 0; font-weight: 700; }
    .table-wrapper { max-width: 1200px; margin: 0 auto; background: #fff; border-radius: 16px; padding: 20px; box-shadow: 0 8px 32px rgba(0,0,0,.1); }
  </style>
</head>
<body>
  <div id="app">
    <header class="user-header">
      <h1 class="title">👥 用户管理</h1>
      <el-button type="primary" @click="openAddDialog">新增用户</el-button>
    </header>
    <div class="table-wrapper">
      <el-table :data="userList" border v-loading="loading">
        <el-table-column prop="id" label="ID" width="80" />
        <el-table-column prop="name" label="姓名" />
        <el-table-column prop="age" label="年龄" width="100" />
        <el-table-column label="操作" width="200">
          <template #default="{ row }">
            <el-button type="primary" size="small" @click="openEditDialog(row)">编辑</el-button>
            <el-button type="danger" size="small" @click="handleDelete(row.id)">删除</el-button>
          </template>
        </el-table-column>
      </el-table>
    </div>
    <el-dialog v-model="dialogVisible" :title="formTitle" width="400px">
      <el-form :model="formData" label-width="80px">
        <el-form-item label="姓名">
          <el-input v-model="formData.name" placeholder="请输入姓名" />
        </el-form-item>
        <el-form-item label="年龄">
          <el-input v-model.number="formData.age" placeholder="请输入年龄" type="number" />
        </el-form-item>
      </el-form>
      <template #footer>
        <el-button @click="dialogVisible = false">取消</el-button>
        <el-button type="primary" @click="handleSubmit">确定</el-button>
      </template>
    </el-dialog>
  </div>

  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
  <script src="https://unpkg.com/element-plus"></script>
  <script>
    const { createApp, ref, onMounted } = Vue

    async function request(url, options = {}) {
      const response = await fetch(url, {
        headers: { 'Content-Type': 'application/json' },
        ...options
      })
      return response.json()
    }

    createApp({
      setup() {
        const userList = ref([])
        const dialogVisible = ref(false)
        const formData = ref({ id: 0, name: '', age: 0 })
        const formTitle = ref('新增用户')
        const loading = ref(false)

        const loadUsers = async () => {
          loading.value = true
          try {
            const response = await request('/api/getUser')
            if (response.code === 200) {
              userList.value = response.data || []
            } else {
              ElementPlus.ElMessage.error(response.msg || '获取用户列表失败')
            }
          } catch (error) {
            ElementPlus.ElMessage.error('获取用户列表失败')
            console.error(error)
          } finally {
            loading.value = false
          }
        }

        const openAddDialog = () => {
          formData.value = { id: 0, name: '', age: 0 }
          formTitle.value = '新增用户'
          dialogVisible.value = true
        }

        const openEditDialog = (user) => {
          formData.value = { ...user }
          formTitle.value = '编辑用户'
          dialogVisible.value = true
        }

        const handleSubmit = async () => {
          if (!formData.value.name || formData.value.age <= 0) {
            ElementPlus.ElMessage.warning('请填写完整信息')
            return
          }
          try {
            if (formData.value.id === 0) {
              const response = await request('/api/addUser', {
                method: 'POST',
                body: JSON.stringify({ name: formData.value.name, age: formData.value.age })
              })
              if (response.code === 200) {
                ElementPlus.ElMessage.success('新增成功')
                dialogVisible.value = false
                loadUsers()
              } else {
                ElementPlus.ElMessage.error(response.msg || '新增失败')
              }
            } else {
              const response = await request('/api/editUser', {
                method: 'PUT',
                body: JSON.stringify(formData.value)
              })
              if (response.code === 200) {
                ElementPlus.ElMessage.success('修改成功')
                dialogVisible.value = false
                loadUsers()
              } else {
                ElementPlus.ElMessage.error(response.msg || '修改失败')
              }
            }
          } catch (error) {
            ElementPlus.ElMessage.error(formData.value.id === 0 ? '新增失败' : '修改失败')
            console.error(error)
          }
        }

        const handleDelete = async (id) => {
          try {
            const response = await request('/api/delUser/' + id, { method: 'DELETE' })
            if (response.code === 200) {
              ElementPlus.ElMessage.success('删除成功')
              loadUsers()
            } else {
              ElementPlus.ElMessage.error(response.msg || '删除失败')
            }
          } catch (error) {
            ElementPlus.ElMessage.error('删除失败')
            console.error(error)
          }
        }

        onMounted(loadUsers)

        return {
          userList, dialogVisible, formData, formTitle, loading,
          openAddDialog, openEditDialog, handleSubmit, handleDelete
        }
      }
    }).use(ElementPlus).mount('#app')
  </script>
</body>
</html>
