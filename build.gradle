plugins {
    id 'java'
    id 'application'
}

group = 'com.example'
version = '1.0-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // SQLite JDBC 驱动
    implementation 'org.xerial:sqlite-jdbc:3.49.1.0'
    // JSON 序列化
    implementation 'com.google.code.gson:gson:2.11.0'
}

application {
    mainClass = 'sqlite.SqliteCrudDemo'
}

sourceSets {
    main {
        java {
            srcDirs = ['src']
        }
    }
}
